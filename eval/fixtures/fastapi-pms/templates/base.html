<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}FastAPI PMS{% endblock %}</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        color: #14343f;
        background: #f3f7f8;
      }
      nav {
        display: flex;
        gap: 1.5rem;
        padding: 1rem 2rem;
        background: #0d5b6b;
      }
      nav a {
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
      main {
        max-width: 60rem;
        margin: 0 auto;
        padding: 2rem;
      }
      .card {
        background: #fff;
        border: 1px solid #dce6e8;
        border-radius: 0.75rem;
        padding: 1.25rem;
        margin-bottom: 1rem;
      }
      .badge {
        border-radius: 999px;
        padding: 0.1rem 0.6rem;
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
      }
      .error {
        color: #b1263c;
        font-weight: 600;
      }
      label {
        display: block;
        margin: 0.5rem 0 0.15rem;
        font-weight: 600;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 0.4rem;
        border: 1px solid #cbd8da;
        border-radius: 0.4rem;
      }
      button {
        cursor: pointer;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="/">Book</a>
      <a href="/reservations">Reservations</a>
      <a href="/spaces">Spaces</a>
      <a href="/guests">Guests</a>
    </nav>
    <main>{% block content %}{% endblock %}</main>
  </body>
</html>
