---
name: _build

on:
  workflow_call:
    inputs:
      node_version:
        description: The Node.js version.
        type: string
        required: false
        default: '24'
    secrets:
      posthog_project_key:
        description: >-
          Seam's PostHog project key, injected into the package when it is
          packed. Without it the packed wizard reports no analytics, which is
          what a pull request build should do.
        required: false
    outputs:
      artifact_name:
        description: The artifact name.
        value: build-${{ github.sha }}

jobs:
  build:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
        with:
          node_version: ${{ inputs.node_version }}
      - name: Build
        run: npm run build
      - name: Package
        run: npm pack
        env:
          SEAM_WIZARD_POSTHOG_KEY: ${{ secrets.posthog_project_key }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ github.sha }}
          if-no-files-found: error
          path: '*.tgz'
